[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "media-kit"
version = "0.1.0"
description = "Framework-independent managed image storage and thumbnail processing"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
dependencies = ["Pillow>=11.0,<14"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["build>=1.2", "mypy>=1.13", "pytest>=8.0", "ruff>=0.8", "setuptools>=68", "wheel"]

[project.scripts]
media-kit = "media_kit.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
media_kit = ["py.typed", "docs/**/*.md", "docs/*.md", "examples/*.py", "*.md", "LICENSE", "offline-manifest.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["media_kit"]
